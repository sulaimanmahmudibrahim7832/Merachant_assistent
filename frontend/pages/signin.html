<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PITMS - Sign In</title>

<link
    rel="stylesheet"
    href="signin.css">

</head><body><main class="auth-container"><!-- BRAND -->

<section class="brand-section">

    <p class="brand-label">
        PITMS
    </p>

    <h1>
        Welcome back
    </h1>

    <p>
        Sign in to manage your products,
        imports, exports, and business activity.
    </p>

</section>



<!-- SIGN IN CARD -->

<section class="signin-card">


    <div class="card-heading">

        <h2>
            Sign In
        </h2>

        <p>
            Enter your account credentials.
        </p>

    </div>



    <form id="signinForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter email address"
                autocomplete="email"
                required>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>

        </div>



        <!-- OPTIONS -->

        <div class="signin-options">


            <label class="remember-option">

                <input
                    id="rememberMe"
                    type="checkbox">

                <span>
                    Remember me
                </span>

            </label>


            <a
                href="#"
                id="forgotPassword">

                Forgot password?

            </a>


        </div>



        <!-- MESSAGE -->

        <p
            id="formMessage"
            class="form-message">
        </p>



        <!-- ACTION -->

        <button
            type="submit"
            class="primary-button">

            Sign In

        </button>


    </form>



    <!-- SIGN UP -->

    <div class="signup-link">

        <span>
            Don't have an account?
        </span>

        <a href="signup.html">
            Create Account
        </a>

    </div>


</section>

</main><script src="signin.js"></script></body></html>
