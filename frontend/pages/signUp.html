<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PITMS - Create Account</title>

<link
    rel="stylesheet"
    href="signup.css">

<!-- BRAND -->

<section class="brand-section">

    <p class="brand-label">
        PITMS
    </p>

    <h1>
        Create your business account
    </h1>

    <p>
        Set up your account to manage products,
        imports, exports, and business movement.
    </p>

</section>



<!-- SIGN UP CARD -->

<section class="signup-card">


    <div class="card-heading">

        <h2>
            Sign Up
        </h2>

        <p>
            Enter your account and business details.
        </p>

    </div>



    <form id="signupForm">


        <!-- PERSONAL INFORMATION -->

        <div class="form-section">

            <h3>
                Personal Information
            </h3>


            <div class="form-grid">


                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        id="firstName"
                        name="firstName"
                        type="text"
                        placeholder="Enter first name"
                        required>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        id="lastName"
                        name="lastName"
                        type="text"
                        placeholder="Enter last name"
                        required>

                </div>


            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="Enter phone number"
                    required>

            </div>


        </div>



        <!-- BUSINESS INFORMATION -->

        <div class="form-section">

            <h3>
                Business Information
            </h3>


            <div class="form-group">

                <label for="businessName">
                    Business Name
                </label>

                <input
                    id="businessName"
                    name="businessName"
                    type="text"
                    placeholder="Enter business name"
                    required>

            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label for="businessType">
                        Business Type
                    </label>

                    <select
                        id="businessType"
                        name="businessType"
                        required>

                        <option value="">
                            Select business type
                        </option>

                        <option value="retail">
                            Retail
                        </option>

                        <option value="wholesale">
                            Wholesale
                        </option>

                        <option value="distribution">
                            Distribution
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="businessLocation">
                        Business Location
                    </label>

                    <input
                        id="businessLocation"
                        name="businessLocation"
                        type="text"
                        placeholder="e.g. Wambai Market"
                        required>

                </div>


            </div>


            <div class="form-group">

                <label for="businessDescription">
                    Business Description
                </label>

                <textarea
                    id="businessDescription"
                    name="businessDescription"
                    rows="3"
                    placeholder="Briefly describe your business">
                </textarea>

            </div>


        </div>



        <!-- ACCOUNT INFORMATION -->

        <div class="form-section">

            <h3>
                Account Information
            </h3>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create password"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="Confirm password"
                        required>

                </div>


            </div>


        </div>



        <!-- TERMS -->

        <div class="terms-group">

            <label>

                <input
                    id="terms"
                    type="checkbox"
                    required>

                <span>
                    I agree to the PITMS terms and conditions.
                </span>

            </label>

        </div>



        <!-- MESSAGE -->

        <p
            id="formMessage"
            class="form-message">
        </p>



        <!-- ACTION -->

        <button
            type="submit"
            class="primary-button">

            Create Account

        </button>


    </form>



    <!-- SIGN IN -->

    <div class="signin-link">

        <span>
            Already have an account?
        </span>

        <a href="signin.html">
            Sign In
        </a>

    </div>


</section>
